name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vars baked into the web build are real on Vercel; CI only needs the build to
  # compile, so skip the boot-time secret validation here.
  SKIP_ENV_VALIDATION: '1'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first so the compiled @dankdeals/db (dist/) and generated Prisma
      # client exist for the downstream lint/typecheck/test tasks.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  migrate:
    name: Apply DB migrations
    needs: quality
    # Railway runs `migrate deploy` on every release (preDeployCommand) using its
    # private network — that is the primary path. This job is an opt-in CI mirror:
    # set repo variable RUN_CI_MIGRATIONS=true and secrets DATABASE_URL/DIRECT_URL.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      vars.RUN_CI_MIGRATIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install db subtree
        run: pnpm install --frozen-lockfile --filter "@dankdeals/db..."

      - name: prisma migrate deploy
        run: pnpm --filter @dankdeals/db migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
