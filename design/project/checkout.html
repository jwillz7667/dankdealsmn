<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — DankDeals</title>
<link rel="icon" href="assets/car-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .co-wrap { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }
  .steps-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 24px; }
  .stepdot { display: flex; align-items: center; gap: 8px; flex: 1; }
  .stepdot__n { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--muted); font-family: var(--font-display); font-weight: 800; font-size: .9rem; display: grid; place-items: center; flex-shrink: 0; transition: .2s; }
  .stepdot__l { font-size: .82rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .stepdot__bar { height: 2px; background: var(--line); flex: 1; border-radius: 2px; }
  .stepdot.active .stepdot__n { background: var(--green); color: #fff; }
  .stepdot.done .stepdot__n { background: var(--ink); color: #fff; }
  .stepdot.active .stepdot__l, .stepdot.done .stepdot__l { color: var(--ink); }

  .co-card { border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 22px; background: #fff; }
  .co-card h2 { font-size: 1.4rem; margin-bottom: 4px; }
  .co-card > p.sub { color: var(--muted); font-size: .92rem; margin-bottom: 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 .full { grid-column: 1/-1; }
  .field { margin-bottom: 14px; }

  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1.5px solid var(--line-2); border-radius: var(--r); cursor: pointer; transition: .15s; margin-bottom: 10px; }
  .opt:hover { border-color: var(--green); }
  .opt.sel { border-color: var(--green); background: var(--green-50); box-shadow: 0 0 0 3px var(--green-100); }
  .opt input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--green); }
  .opt__main { flex: 1; }
  .opt__main b { font-family: var(--font-display); display: block; }
  .opt__main span { color: var(--muted); font-size: .88rem; }
  .opt__icon { width: 40px; height: 40px; border-radius: 11px; background: var(--surface); color: var(--green-700); display: grid; place-items: center; flex-shrink: 0; }

  .tips { display: flex; gap: 8px; flex-wrap: wrap; }
  .tip { flex: 1; min-width: 64px; text-align: center; padding: 12px 8px; border: 1.5px solid var(--line-2); border-radius: var(--r); font-family: var(--font-display); font-weight: 700; cursor: pointer; transition: .15s; }
  .tip.sel { border-color: var(--green); background: var(--green); color: #fff; }

  .idbox { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); }
  .idbox .ic { color: var(--green); margin-bottom: 8px; }
  .idbox .ic svg { width: 32px; height: 32px; }

  .co-nav { display: flex; gap: 12px; margin-top: 20px; }

  .review-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .review-row:last-child { border-bottom: none; }
  .review-row .k { color: var(--muted); font-size: .85rem; }
  .review-row .v { text-align: right; font-weight: 600; }
  .edit-link { color: var(--green-700); font-weight: 700; font-size: .82rem; }

  .summary { border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 22px; background: #fff; }
  .summary h3 { font-size: 1.2rem; margin-bottom: 14px; }
  .sum-line { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; padding: 8px 0; align-items: center; font-size: .9rem; }
  .sum-line image-slot { width: 44px; height: 44px; }
  .sum-line .nm { font-weight: 600; line-height: 1.2; }
  .sum-line .qx { color: var(--muted); font-size: .8rem; }

  @media (min-width: 880px) {
    .co-wrap { grid-template-columns: 1fr 360px; gap: 40px; }
    .summary { position: sticky; top: calc(var(--header-h) + 16px); }
  }
</style>
</head>
<body data-page="cart">

<section style="background:var(--surface);border-bottom:1.5px solid var(--line)">
  <div class="wrap" style="padding-block:20px">
    <div class="crumb" style="font-size:.82rem;color:var(--muted);margin-bottom:8px"><a href="cart.html">Cart</a> / <span>Checkout</span></div>
    <h1 style="font-size:clamp(1.7rem,6vw,2.4rem)">Checkout</h1>
  </div>
</section>

<main class="wrap section" style="padding-top:24px">
  <div class="co-wrap">
    <div>
      <div class="steps-bar" id="stepsBar"></div>
      <div id="stepHost"></div>
    </div>
    <aside class="summary" id="orderSummary"></aside>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/image-slot.js"></script>
<script src="js/chrome.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
